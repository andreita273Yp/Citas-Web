@if (!clinical.isAuthenticated()) {
  <app-login></app-login>
} @else {
  <app-identity-dashboard></app-identity-dashboard>
  @if (session.role() !== 'admin') {
    <app-my-appointments></app-my-appointments>
  }
  @if (session.role() === 'doctor' || session.role() === 'admin') {
    <app-operations-panel></app-operations-panel>
  }
}
