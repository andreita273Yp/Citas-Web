@if (!clinical.isAuthenticated()) {
  <app-login></app-login>
} @else {
  <app-identity-dashboard></app-identity-dashboard>
  @switch (session.role()) {
    @case ('admin') {
      <app-operations-panel></app-operations-panel>
      <app-admin-offer></app-admin-offer>
    }
    @case ('doctor') {
      <app-professional-agenda></app-professional-agenda>
      <app-operations-panel></app-operations-panel>
    }
    @default {
      <app-book-appointment></app-book-appointment>
      <app-my-appointments></app-my-appointments>
    }
  }
}
